<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // GitHub Pages SPA redirect — encodes the path as a query param so
    // index.html can restore it with history.replaceState before React boots.
    // pathSegmentsToKeep = 0 for the apex custom domain (hat.fm). With
    // pathSegmentsToKeep = 1 (the old subpath-deploy value) on an apex
    // domain, the redirect lands on the same 404'd path and recurses,
    // producing URLs like /slug/?/&/~and~/~and~/~and~/…
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + 0).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(0).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
